services:

  postgres:
    image: postgres:16-alpine
    container_name: trixi-postgres
    environment:
      POSTGRES_DB: trixi_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"

  app:
    build: .
    container_name: trixi-app
    depends_on:
      - postgres
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/trixi_db
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
    ports:
      - "8080:8080"